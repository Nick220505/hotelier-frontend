<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8FAFC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E11D48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="60" cy="60" r="55" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  
  <!-- Hotel Building -->
  <g transform="translate(60, 60)">
    <!-- Main building -->
    <rect x="-25" y="-15" width="50" height="35" fill="url(#buildingGradient)" rx="2" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Roof -->
    <polygon points="-30,-15 0,-35 30,-15" fill="url(#roofGradient)" stroke="#B91C1C" stroke-width="1"/>
    
    <!-- Building details -->
    <rect x="-20" y="-10" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    <rect x="-8" y="-10" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    <rect x="4" y="-10" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    <rect x="16" y="-10" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    
    <!-- Second floor windows -->
    <rect x="-20" y="2" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    <rect x="-8" y="2" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    <rect x="4" y="2" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    <rect x="16" y="2" width="8" height="8" fill="#3B82F6" rx="1" opacity="0.8"/>
    
    <!-- Entrance door -->
    <rect x="-4" y="12" width="8" height="8" fill="#1F2937" rx="1"/>
    <circle cx="2" cy="16" r="0.5" fill="#FCD34D"/>
    
    <!-- Hotel sign -->
    <rect x="-12" y="-25" width="24" height="6" fill="#1F2937" rx="1" opacity="0.9"/>
    <text x="0" y="-20" text-anchor="middle" fill="white" font-size="3" font-family="Arial, sans-serif" font-weight="bold">HOTEL</text>
    
    <!-- Decorative elements -->
    <circle cx="-35" cy="-25" r="3" fill="#FCD34D" opacity="0.8"/>
    <circle cx="35" cy="-25" r="3" fill="#FCD34D" opacity="0.8"/>
    
    <!-- Stars -->
    <polygon points="-38,-30 -36,-28 -34,-30 -36,-32" fill="#FCD34D"/>
    <polygon points="38,-30 40,-28 42,-30 40,-32" fill="#FCD34D"/>
  </g>
</svg>
